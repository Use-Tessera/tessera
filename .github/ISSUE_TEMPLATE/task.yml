name: Task
description: A scoped piece of work (maintainers use this for Wave issues).
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters and where it lives in the code.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What to change, and what is explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable acceptance criteria, including the tests that must exist.
    validations:
      required: true
