[workspace]
resolver = "3"
members = ["crates/tessera-core", "crates/tessera-policy", "crates/tessera-signer", "crates/tessera-cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Use-Tessera/tessera"
homepage = "https://github.com/Use-Tessera"
authors = ["Tessera"]

[workspace.dependencies]
tessera-core = { path = "crates/tessera-core", version = "0.1.0" }
tessera-policy = { path = "crates/tessera-policy", version = "0.1.0" }
frost-ed25519 = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.3"
stellar-xdr = { version = "28.0.1", default-features = false, features = ["std", "base64"] }
sha2 = "0.11"
ed25519-dalek = "3"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
hex = "0.4"
base64 = "0.23"
thiserror = "2"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "env"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Curve arithmetic dominates test time; optimize dependencies in dev builds.
[profile.dev.package."*"]
opt-level = 3
