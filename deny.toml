# cargo-deny: licenses, security advisories and dependency sources.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # atomic-polyfill is unmaintained (not vulnerable). It reaches us only via
  # frost-core -> postcard -> heapless 0.7 and is compiled solely for targets
  # without native atomics, none of which Tessera supports.
  { id = "RUSTSEC-2023-0089", reason = "transitive via frost-core; unused on supported targets" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
