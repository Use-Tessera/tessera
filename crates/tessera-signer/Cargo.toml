[package]
name = "tessera-signer"
description = "Tessera signer daemon: holds one FROST key share and co-signs only what its policy allows."
keywords = ["stellar", "frost", "threshold", "signer", "custody"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tessera-signer"
path = "src/main.rs"

[dependencies]
tessera-core.workspace = true
tessera-policy.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
hex.workspace = true
sha2.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ed25519-dalek.workspace = true
tempfile = "3"
hex.workspace = true

[lints]
workspace = true
